    expect: marginal
    note: "crooked on the glass, with grain"
  - name: photo-portrait
    file: photo-portrait.png
    profile: embroidery-basic
    category: photo
    expect: hopeless
    note: "smooth shading, no flat regions at all"
  - name: photo-landscape
    file: photo-landscape.png
    profile: embroidery-basic
    category: photo
    expect: hopeless
    note: "sky gradient over textured ground"
  - name: photo-busy
    file: photo-busy.png
    profile: embroidery-basic
