name: embroidery-basic
title: Basic embroidery requirements
description: >
  The common denominator most embroidery shops ask for: a print-ready size,
  a handful of flat colours separated per layer, no gradients, text converted
  to paths, closed contours and lines thick enough to be stitched.

rules:
  - id: file.extension
    params:
      allowed: [".svg"]

  - id: geometry.canvas_size
    params:
      min_cm: 10
      max_cm: 38

  - id: geometry.require_viewbox
    severity: warning

  - id: color.max_count
    params:
      max_colors: 3

  - id: color.no_gradients

  - id: color.no_transparency
    severity: warning

  - id: structure.color_layers
    params:
      require_layers: true
      max_colors_per_layer: 1

  - id: element.forbidden
    params:
      tags: ["text", "image", "filter", "foreignObject", "mask"]

  - id: document.no_raster

  - id: document.no_editor_metadata
    severity: warning

  - id: path.closed
    params:
      check_subpaths: true

  - id: stroke.min_width
    params:
      min_mm: 1.5

  # A shape smaller than the stitch that would fill it is a knot, a trim and a
  # jump for nothing. A warning here rather than an error: one stray fleck does
  # not make a file unusable, and the shop that cares about it is the strict
  # one. Unlike geometry.min_feature_size this needs nothing installed, so it
  # can sit in the common-denominator profile without its verdict depending on
  # what a machine has.
  - id: geometry.min_area
    params:
      min_mm2: 2.25
    severity: warning

  - id: fill.required
    severity: warning
