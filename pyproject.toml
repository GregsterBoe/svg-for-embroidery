[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-for-embroidery"
version = "0.1.0"
description = "Modular rule checker for SVG files destined for embroidery and print-on-demand shops"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# Optional capabilities. The core never needs these; `svgemb doctor` reports
# which are present and how to install the rest.
render = ["cairosvg>=2.7"]          # fallback renderer; a binary is preferred
geometry = ["shapely>=2.0"]         # path offsetting, booleans (roadmap A5)
convert = ["Pillow>=10.0", "numpy>=1.24"]  # raster pipeline (roadmap B3+)
# Tracers, for machines that cannot install the potrace binary. potracer is the
# same algorithm in pure Python (needs numpy, ~11x slower); vtracer traces
# colour directly. See docs/spikes/B0-tracers.md for why the binary is default.
trace = ["potracer>=0.0.4", "vtracer>=0.6"]

[project.scripts]
svgemb = "svg_embroidery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svg_embroidery = ["profiles/builtin/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: measures the whole benchmark corpus; deselect with -m 'not slow'",
]
