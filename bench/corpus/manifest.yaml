# The B1 benchmark corpus.
#
# Generated by bench/make_corpus.py — edit that, not this. Each entry names
# the profile the image is aimed at, so a metric like 'too thin to stitch'
# means too thin *for that shop* rather than in the abstract.
#
# expect: what a human would say before measuring anything. B2's triage is
# graded against this column; B1 only records it.

images:
  - name: logo-two-colour
    file: logo-two-colour.png
    profile: embroidery-basic
    category: logo
    expect: good
    note: "two flat colours, crisp edges — the easy case"
  - name: logo-three-colour
    file: logo-three-colour.png
    profile: embroidery-basic
    category: logo
    expect: good
    note: "exactly the profile's colour budget"
  - name: logo-five-colour
    file: logo-five-colour.png
    profile: embroidery-basic
    category: logo
    expect: marginal
    note: "five flat colours into a three-colour profile"
  - name: monogram
    file: monogram.png
    profile: embroidery-basic
    category: logo
    expect: good
    note: "one colour, thick strokes"
  - name: line-art-thick
    file: line-art-thick.png
    profile: embroidery-basic
    category: line-art
    expect: good
    note: "5px strokes — comfortably stitchable"
  - name: line-art-thin
    file: line-art-thin.png
    profile: embroidery-basic
    category: line-art
    expect: marginal
    note: "1px strokes — below the needle's minimum"
  - name: hatching
    file: hatching.png
    profile: embroidery-basic
    category: line-art
    expect: hopeless
    note: "dense crosshatch: almost all of it is too fine"
  - name: scan-clean
