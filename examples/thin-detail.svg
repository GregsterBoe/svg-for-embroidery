<?xml version="1.0" encoding="UTF-8"?>
<!-- Purpose-built for the A5 minimum-feature check: everything a checker that
     only reads attributes would call perfect. 12x12 cm, one colour, one layer,
     every contour closed, not a stroke in the file. The defects are in the
     geometry, and only measuring the shapes finds them.

     Three shapes are fine and must stay that way — including the 3 mm square,
     which loses 5% of its area to the corner rounding of the test itself and
     would be a false positive without the corner allowance. -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="12cm" height="12cm" viewBox="0 0 120 120">
  <g id="layer-black" fill="#000000" stroke="none">
    <!-- fine: a solid block, a small square, a disc -->
    <rect id="solid" x="8" y="8" width="30" height="30"/>
    <rect id="small-square" x="45" y="8" width="3" height="3"/>
    <circle id="disc" cx="65" cy="20" r="8"/>

    <!-- 0.4 mm tall: no part of it survives a 1.5 mm stitch -->
    <rect id="hairline" x="8" y="45" width="100" height="0.4"/>

    <!-- a solid block with a needle spike growing out of its side -->
    <path id="spike" d="M 8 55 L 28 55 L 28 64.8 L 100 65 L 28 65.2 L 28 75 L 8 75 Z"/>

    <!-- two blocks joined by a 0.6 mm waist that will not hold -->
    <path id="waist" d="M 8 85 L 23 85 L 23 97.2 L 43 97.2 L 43 85 L 58 85
                        L 58 105 L 43 105 L 43 97.8 L 23 97.8 L 23 105 L 8 105 Z"/>
  </g>
</svg>
